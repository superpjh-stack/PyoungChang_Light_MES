[project]
name = "kkotsuni"
version = "0.2.0"
description = "평창꽃순이 주문·출고·거래명세서 MES"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "jinja2>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "python-multipart>=0.0.20,<1",
    "openpyxl>=3.1,<4",
    "itsdangerous>=2.2,<3",
    "xlrd>=2,<3",
]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.9,<1", "playwright>=1.50,<2"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/kkotsuni"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
target-version = "py312"
line-length = 120
