<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 · {{ app_name }}</title><link rel="stylesheet" href="/static/style.css?v=brand-site-1"></head>
<body class="login-page"><main class="login-main"><section class="card login-card" aria-labelledby="login-title"><div class="login-mark" aria-hidden="true">꽃</div><p class="eyebrow">{{ app_name }}</p><h1 id="login-title">로그인</h1><hr class="login-rule"><p class="muted">평창의 정성을, 정확한 업무로. 계정으로 로그인하여 업무를 시작하세요.</p>{% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}<form method="post" action="/login"><input type="hidden" name="_csrf" value="{{ csrf }}"><input type="hidden" name="next" value="{{ target }}"><label class="form-field"><span>아이디</span><input name="username" autocomplete="username" required maxlength="100" autofocus></label><label class="form-field"><span>비밀번호</span><input type="password" name="password" autocomplete="current-password" required maxlength="256"></label><button type="submit">로그인</button></form><p class="login-foot">평창꽃순이김치 · 주문 · 출고 · 거래명세서</p></section></main></body></html>
